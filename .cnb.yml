# cnb CI: the checks of .github/workflows/ci.yml, on pushes to main and on PRs into main, except the codec tests.
# Script arrays are joined with &&, so any failing command fails the stage.
main:
  push: &checks
    - name: backend
      docker:
        # Python with the CJK fonts and uv, built from this file once and reused until it changes.
        build:
          dockerfile: .cnb/ci-backend.Dockerfile
          versionBy:
            - .cnb/ci-backend.Dockerfile
        volumes:
          - /root/.cache/uv:copy-on-write
          # mypy rechecks only what changed since the last run on the same build machine.
          - /root/.cache/mypy:copy-on-write
      env:
        MYPY_CACHE_DIR: /root/.cache/mypy
      stages:
        - name: sync
          script: uv sync --frozen --python 3.12
        - name: ruff
          script:
            - uv run ruff check src tests deploy
            - uv run ruff format --check src tests deploy
        - name: mypy
          script: uv run mypy
        - name: pytest
          # Each worker has its own temporary databases, so tests run in parallel. The tests that run the real
          # ffmpeg (marked codec) are left to the codec host, as scripts/check.py does; the image has no ffmpeg.
          script: uv run pytest -q -n auto -m "not codec"

    - name: frontend
      docker:
        image: node:22-bookworm
        volumes:
          - /root/.local/share/pnpm/store:copy-on-write
      stages:
        - name: install
          script:
            # The pnpm version pinned in frontend/package.json; corepack would pick its own from the repo root.
            - npm install -g "$(node -p "require('./frontend/package.json').packageManager")"
            - pnpm -C frontend install --frozen-lockfile
        - name: typecheck
          script: pnpm -C frontend typecheck
        - name: lint
          script: pnpm -C frontend lint
        - name: test
          script: pnpm -C frontend test
        - name: build
          script: pnpm -C frontend build
        - name: static matches build
          script:
            - git diff --exit-code src/twin/web/static
            - test -z "$(git status --porcelain src/twin/web/static)"

  pull_request: *checks

  # The "发布到 stable" button on the main branch page (.cnb/web_trigger.yml): checks that the chosen main commit
  # passed the checks above and that stable fast-forwards to it, prints what is released, then pushes stable.
  web_trigger_release:
    - name: release-stable
      docker:
        image: python:3.12-bookworm
      stages:
        - name: release
          script: python3 deploy/release_stable.py

# Releasing (the button above fast-forwards stable to a main commit that passed its checks, so they don't run again)
# deploys to daw, served at https://daw.xjjk.com/twin/.
# Same route as the audiostudio project on the same machine: Tencent Cloud TAT runs deploy/daw/deploy.sh as root.
stable:
  push:
    - name: deploy-daw
      docker:
        image: python:3.12-bookworm
        volumes:
          - /root/.cache/uv:copy-on-write
      imports:
        - https://cnb.cool/xjjk/config/-/blob/main/env.dev.yml
      env:
        TWIN_TAT_REGION: ap-nanjing
        TWIN_TAT_INSTANCE_ID: ins-mgz1lxik
      stages:
        - name: tools
          script: pip install --no-cache-dir uv==0.13.0
        - name: package
          # Only what runs on daw; the committed frontend build is under src/twin/web/static.
          script: >-
            git archive --format=tar.gz --output=/tmp/twin-release.tar.gz HEAD --
            src pyproject.toml uv.lock README.md twin.toml.example deploy/daw deploy/compute
        - name: deploy
          lock:
            key: twin-daw-production
            expires: 1800
            wait: true
            timeout: 600
          script: uv run --no-project --with tencentcloud-sdk-python-common python deploy/daw/deploy_via_tat.py /tmp/twin-release.tar.gz
        - name: daw switched
          # A deploy that exits 0 without switching daw has happened; only what daw serves turns the job green.
          script: python3 deploy/daw/check_live.py "$CNB_COMMIT"
