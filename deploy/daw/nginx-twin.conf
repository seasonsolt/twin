# twin under https://daw.xjjk.com/twin/ — included inside the audio-studio server block, which owns daw.xjjk.com.
# The load balancer terminates HTTPS and forwards plain HTTP to port 80.
# Installed by deploy/daw/deploy.sh to /etc/nginx/snippets/daw-apps/twin.conf.

location = /twin {
    absolute_redirect off;
    return 301 /twin/;
}

location ^~ /twin/ {
    # The trailing slash strips /twin, so twin itself still serves from its root.
    proxy_pass http://127.0.0.1:8770/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    # Scopes twin's session cookie and redirects to /twin/, away from audio-studio on the same host.
    proxy_set_header X-Forwarded-Prefix /twin;
    # Chat replies and job progress stream; uploads go straight through in chunks.
    proxy_buffering off;
    proxy_request_buffering off;
    client_max_body_size 2g;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
