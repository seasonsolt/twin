[project]
name = "twin"
version = "0.1.0"
description = "Personal twin: identity -> memory upload -> grounded conversation, speech and playback"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "anthropic>=0.60",
    "openai>=1.40",
    "httpx>=0.27",
    "numpy>=1.26",
    "typer>=0.12",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "mcp>=1.30.0,<2",
    "pillow>=12.3.0",
    "pypdf>=6.0",
    "python-docx>=1.2",
    "charset-normalizer>=3.4",
    "python-multipart>=0.0.20",
    "pillow-heif>=1.4.0",
]

[project.scripts]
twin = "twin.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
 "ruff>=0.6",
 "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twin"]

[tool.ruff]
line-length = 120
# Frozen code snapshots inside validation run records are evidence, not maintained code.
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["twin"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
